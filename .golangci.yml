version: "2"
run:
  go: "1.26"
linters:
  enable:
    - funlen
    - goconst
    - gocyclo
    - lll
    - misspell
  disable:
    - gochecknoglobals
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    funlen:
      lines: 100
      statements: 50
    goconst:
      min-len: 2
      min-occurrences: 3
    gocyclo:
      min-complexity: 15
    govet:
      enable:
        - shadow
    lll:
      line-length: 120
    misspell:
      locale: US
      ignore-rules:
        - dialogue
        - cancelled
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - funlen
          - gocyclo
        path: _test\.go
      - linters:
          - lll
        path: latex/write\.go
        text: \\newcommand
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/lapingvino/lexington
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
