Name = "Bande dessinée (European)"
Description = """
A European comic script, planche by planche and case by case, as \
Goscinny and others typed them: the drawing instructions on the left \
half of the page, the captions and dialogue on the right half, so the \
artist reads the picture and the text side by side. Each planche a \
forced scene heading (.PLANCHE 1), each case an action (Case 1. ...)."""

[Elements.scene]
Left = 1.0
Right = 1.0
Style = "bu"

[Elements.action]
Left = 1.0
Right = 4.5

[Elements.speaker]
Left = 4.5
Right = 0.75
Style = "b"
Postfix = ":"

[Elements.dialog]
Left = 4.5
Right = 0.75

[Elements.paren]
Left = 4.5
Right = 0.75
Style = "i"

[Elements.section]
Left = 1.0
Right = 1.0
Style = "b"
Align = "C"

[Elements.trans]
Left = 4.5
Right = 0.75
Align = "R"
