Name = "Stage play (US)"
Description = """
The manuscript format of American play publishers and competitions: \
character names centred, dialogue across the page, stage directions \
indented in italics, acts (Fountain sections, # ACT ONE) and scenes \
centred. Write scene headings as forced ones (.SCENE 1) or sections."""

