Name = "Stage play (UK)"
Description = """
The British stage play layout of the BBC Writersroom's template: names \
with a colon at the left, the speech indented, stage directions \
further in (type them in capitals), acts and scenes at the left. \
Lexington puts the name and the speech on separate lines."""

