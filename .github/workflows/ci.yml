name: CI

on:
  push:
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Get dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          fail_ci_if_error: false

      - name: Build
        run: go build -v ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # only what a change adds: the code has older findings to clear up
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15
          only-new-issues: true
          args: --timeout=5m

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        run: go build -o lexington .

      - name: Test basic functionality
        run: |
          # Test help output
          ./lexington -help

          # Test dual dialogue conversion
          ./lexington -i testdata/input/simple_dual.fountain -to html -o test_output.html
          [ -f test_output.html ] && echo "HTML output created successfully"

          # Test PDF generation
          ./lexington -i testdata/input/dual_dialogue.fountain -to pdf -o test_output.pdf
          [ -f test_output.pdf ] && echo "PDF output created successfully"

          # Test configuration dump
          ./lexington -dumpconfig -config test_config.toml
          [ -f test_config.toml ] && echo "Configuration dump successful"

      - name: Install the programs some formats need
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc texlive-latex-base texlive-latex-recommended calibre
          sudo apt-get install -y --no-install-recommends wkhtmltopdf || echo "wkhtmltopdf is not available"

      - name: Test the formats made with other programs
        run: go test -v -run TestExternalFormats ./cli

      - name: Cleanup
        run: rm -f test_output.* test_config.toml
