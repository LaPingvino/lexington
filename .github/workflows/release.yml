name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Get dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Set binary name
        id: binary
        run: |
          BINARY_NAME=lexington
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
          fi
          echo "name=${BINARY_NAME}" >> $GITHUB_OUTPUT
          echo "archive=lexington-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o ${{ steps.binary.outputs.name }} .

      - name: Create archive
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r ${{ steps.binary.outputs.archive }}.zip ${{ steps.binary.outputs.name }} LICENSE README.md
          else
            tar -czf ${{ steps.binary.outputs.archive }}.tar.gz ${{ steps.binary.outputs.name }} LICENSE README.md
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.binary.outputs.archive }}
          path: |
            ${{ steps.binary.outputs.archive }}.tar.gz
            ${{ steps.binary.outputs.archive }}.zip
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create release notes
        id: release_notes
        # The tag's own section of CHANGELOG.md ("## [1.14.0] - date" up to the
        # next "## ["), with the install lines after it; if the CHANGELOG has
        # no section for the tag, GitHub's generated notes are used instead.
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > section.md
          if [ -s section.md ] && grep -q '[^[:space:]]' section.md; then
            {
              echo "# Lexington ${GITHUB_REF_NAME}"
              echo
              cat section.md
              echo
              echo "## Install"
              echo
              echo "Download the binary for your system below, use it in the browser at https://lapingvino.github.io/lexington/, or:"
              echo
              echo '```bash'
              echo "go install github.com/LaPingvino/lexington@${GITHUB_REF_NAME}"
              echo '```'
              echo
              echo "The full history is in [CHANGELOG.md](https://github.com/LaPingvino/lexington/blob/${GITHUB_REF_NAME}/CHANGELOG.md)."
            } > release_notes.md
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            : > release_notes.md
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Flatten artifacts
        run: |
          find ./artifacts -name "*.tar.gz" -exec mv {} . \;
          find ./artifacts -name "*.zip" -exec mv {} . \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.zip
          body_path: release_notes.md
          generate_release_notes: ${{ steps.release_notes.outputs.generate == 'true' }}
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
